name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy values only used to make `next build` succeed in CI — the build
  # never talks to a real database or Clerk instance. Real secrets live in
  # the deployment platform's env vars, never in this repo.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/kdp"
  CLERK_SECRET_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dmFsaWQta2V5LWZvci1jaS5jbGVyay5hY2NvdW50cy5kZXYk"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm --filter @kdp/web lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true
